<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<title>Nibble</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#f7f5f2; --ink:#1f1f1f; --muted:#6b6b6b; --card:#fff; --amber:#e89a3c; --border:#e6e2dc; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.4; }
header { padding:16px 20px 8px; display:flex; align-items:center; gap:10px; }
.logo { width:28px; height:28px; background:#2c2c2c; border-radius:6px; position:relative; }
.logo:before { content:""; position:absolute; left:4px; top:2px; width:8px; height:14px; background:#f7f5f2; border-radius:4px 4px 0 0; }
.logo:after { content:""; position:absolute; right:4px; top:6px; width:8px; height:10px; background:#e89a3c; border-radius:0 0 4px 4px; }
h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-0.3px; }
.tabs { display:flex; border-bottom:1px solid var(--border); background:#fff; position:sticky; top:0; z-index:10; }
.tab { flex:1; padding:12px 4px; text-align:center; font-size:13px; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; }
.tab.active { color:var(--ink); border-bottom-color:var(--amber); font-weight:600; }
main { padding:16px 20px 80px; max-width:520px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
input, textarea { width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; font:inherit; background:#fff; }
button.primary { background:var(--ink); color:#fff; border:none; padding:12px 16px; border-radius:8px; font:inherit; cursor:pointer; width:100%; margin-top:8px; }
button.primary:active { opacity:0.85; }
.badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
.badge.supported { background:#e8f5e9; color:#2e7d32; }
.badge.refuted { background:#ffebee; color:#c62828; }
.badge.context { background:#fff8e1; color:#f57f17; }
.badge.contested { background:#e3f2fd; color:#1565c0; }
.badge.unsupported { background:#f5f5f5; color:#616161; }
.amber { color:var(--amber); }
.muted { color:var(--muted); font-size:14px; }
.footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); padding:10px 20px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Nibble</h1>
</header>
<nav class="tabs">
  <button class="tab active" data-tab="check">Check</button>
  <button class="tab" data-tab="play">Play</button>
  <button class="tab" data-tab="kit">Kit</button>
  <button class="tab" data-tab="log">Log</button>
</nav>
<main id="app"></main>
<div class="footer">Scored against the shipped pack only · No check, no confidence</div>
<script src="app.js"></script>
</body>
</html>
